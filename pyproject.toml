[project]
name = "gordon-control-plane"
version = "0.1.0"
description = "Two-Plane multi-agent control plane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "temporalio",
    "langgraph",
    "litellm",
    "langgraph-checkpoint-postgres",
    "mcp",
    "psycopg[binary]",
    "fastapi",
    "uvicorn",
    "watchdog",
    "httpx",
    "orjson"
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov>=7.1.0",
    "pre-commit",
    "locust",
    "kubernetes",
    "types-PyYAML"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/e2e"]
