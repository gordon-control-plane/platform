name: Build and Push Images

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        component:
          - { name: "unified-api", path: "build/Dockerfile.unified-api" }
          - { name: "frontend", path: "build/Dockerfile.frontend" }
          - { name: "agent-platform-worker", path: "build/Dockerfile.worker" }

    uses: ./.github/workflows/_build-scan-push.yml
    with:
      dockerfile: ${{ matrix.component.path }}
      image: ghcr.io/${{ github.repository_owner }}/${{ matrix.component.name }}
