name: Build and Push Images

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        component:
          - { name: "mcp-server", path: "." }
          - { name: "interactive-agent", path: "." }
          - { name: "agent-platform-worker", path: "." }
          - { name: "sandbox", path: "." }
          - { name: "relay", path: "." }

    uses: ./.github/workflows/_build-scan-push.yml
    with:
      dockerfile: ${{ matrix.component.path }}/Dockerfile
      image: ghcr.io/${{ github.repository_owner }}/${{ matrix.component.name }}
