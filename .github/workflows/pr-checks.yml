name: pr-checks
on:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Environment Setup
        run: |
          pip install uv
          make setup
      - name: Run prek checks
        run: uvx prek run --all-files
      - name: Run pytest
        run: uv run pytest tests/
      - name: Helm lint
        run: |
          for chart in charts/*; do
            if [ -d "$chart" ] && [ -f "$chart/Chart.yaml" ]; then
              helm lint "$chart"
            fi
          done
