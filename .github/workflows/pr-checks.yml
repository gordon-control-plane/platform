name: pr-checks
on:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: pip install uv && uv sync
      - name: Run prek checks
        run: uvx prek run --all-files
      - name: Run unit tests
        run: |
          # Verify tests exist and have no syntax errors before applying filters
          uv run pytest tests/unit/ --collect-only -q > .pytest-collect.log || collect_code=$?
          if [ "${collect_code:-0}" -ne 0 ]; then
            cat .pytest-collect.log
            echo "::error::Test collection failed (code $collect_code). Tests missing or syntax errors."
            exit "$collect_code"
          fi
          # Run tests excluding quarantined ones
          uv run pytest tests/unit/ -m "not quarantine" || exit_code=$?
          if [ "${exit_code:-0}" -ne 0 ] && [ "${exit_code:-0}" -ne 5 ]; then exit "$exit_code"; fi
      - name: Helm lint
        run: helm lint charts/agent-platform
