name: Infra CI & Security

on:
  pull_request:

jobs:
  scan-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      - name: Run Helm Lint
        run: helm lint charts/agent-platform

      - name: Kube-Linter (Best Practices)
        uses: stackrox/kube-linter-action@v1.0.4
        with:
          directory: charts/agent-platform
          # We'll ignore the plaintext password warning for postgresql subchart since it's dev default
          config: .kube-linter.yaml

      - name: Run Trivy vulnerability scanner (IaC)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'charts/agent-platform'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Run Checkov (Policy-as-Code)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: charts/agent-platform
          framework: helm
          quiet: true

      - name: Install Kubeconform
        run: |
          wget https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar -xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Run Kubeconform (Strict Schema & OCP Validation)
        run: |
          helm template agent-platform charts/agent-platform \
            --set secrets.langfuseNextauthSecret="dummy" \
            --set secrets.langfuseSalt="dummy" \
            | kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
  kind-integration:
    runs-on: ubuntu-latest
    needs: scan-and-lint
    environment: e2e-tests
    steps:
      - uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: e2e-cluster
          config: scripts/kind-config.yaml

      - name: Build Helm Dependencies
        run: helm dependency update charts/agent-platform

      - name: Install uv
        uses: astral-sh/setup-uv@v5


      - name: Deploy to Kind
        run: |
          # Set default kind API URL
          KUBE_API_URL="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          export KUBE_API_URL
          make deploy KUBE_API_URL="$KUBE_API_URL"
      - name: Map NodePorts to localhost
        run: echo '127.0.0.1 agent-platform-postgresql agent-platform-temporal-frontend' | sudo tee -a /etc/hosts
      - name: Run Integration Tests
        run: |
          # Verify tests exist and have no syntax errors before applying filters
          uv run pytest tests/integration/ --collect-only -q > .pytest-collect.log || collect_code=$?
          if [ "${collect_code:-0}" -ne 0 ]; then
            cat .pytest-collect.log
            echo "::error::Test collection failed (code $collect_code). Tests missing or syntax errors."
            exit "$collect_code"
          fi
          # Run tests excluding quarantined ones
          uv run pytest tests/integration/ -m "not quarantine" || exit_code=$?
          if [ "${exit_code:-0}" -ne 0 ] && [ "${exit_code:-0}" -ne 5 ]; then exit "$exit_code"; fi
      - name: Run E2E Tests
        run: |
          KUBE_API_URL="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          export KUBE_API_URL
          make test-e2e KUBE_API_URL="$KUBE_API_URL"
