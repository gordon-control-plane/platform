name: Infra CI & Security

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]


permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  enforce-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for mixed Dockerfile and source changes
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-isolation-check') }}
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD^1 HEAD)
          HAS_DOCKERFILE=0
          HAS_OTHER=0
          for file in $CHANGED_FILES; do
            if [[ "$file" == *"Dockerfile"* ]]; then
              HAS_DOCKERFILE=1
            else
              HAS_OTHER=1
            fi
          done

          if [ "$HAS_DOCKERFILE" -eq 1 ] && [ "$HAS_OTHER" -eq 1 ]; then
            echo "::error::PR mixes Dockerfile changes with other source code!"
            echo "To keep CI builds fast and isolated, Dockerfile updates must be in their own PR."
            echo "If this is a massive cross-cutting feature (like the current tailscale ingress PR), add the 'skip-isolation-check' label to this PR to bypass this rule."
            exit 1
          fi
          echo "Isolation check passed."

  scan-and-lint:
    needs: enforce-isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      - name: Run Helm Lint
        run: helm lint charts/agent-platform

      - name: Kube-Linter (Best Practices)
        uses: stackrox/kube-linter-action@v1.0.4
        with:
          directory: charts/agent-platform
          # We'll ignore the plaintext password warning for postgresql subchart since it's dev default
          config: .kube-linter.yaml

      - name: Run Trivy vulnerability scanner (IaC)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'charts/agent-platform'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Run Checkov (Policy-as-Code)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: charts/agent-platform
          framework: helm
          quiet: true

      - name: Install Kubeconform
        run: |
          wget https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar -xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Run Kubeconform (Strict Schema & OCP Validation)
        run: |
          helm template agent-platform charts/agent-platform \
            --set secrets.langfuseNextauthSecret="dummy" \
            --set secrets.langfuseSalt="dummy" \
            | kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
  kind-integration:
    runs-on: ubuntu-latest
    needs: scan-and-lint
    environment: e2e-tests
    steps:
      - uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: e2e-cluster

      - name: Install uv
        run: pip install uv

      - name: Deploy to Kind
        run: |
          # Set default kind API URL
          KUBE_API_URL="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          export KUBE_API_URL
          export GH_PAT="${{ secrets.GITHUB_TOKEN }}"
          export IMAGE_TAG="main"
          make deploy KUBE_API_URL="$KUBE_API_URL" HELM_ARGS="--set tailscaleIngress.enabled=false"

      - name: Run Smoke Tests
        run: |
          KUBE_API_URL="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          export KUBE_API_URL
          export GH_PAT="${{ secrets.GITHUB_TOKEN }}"
          export IMAGE_TAG="main"
          make test-e2e KUBE_API_URL="$KUBE_API_URL"
