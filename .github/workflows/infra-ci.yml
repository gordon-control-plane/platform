name: Infra CI & Security

on:
  pull_request:

jobs:
  scan-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      - name: Run Helm Lint
        run: helm lint charts/agent-platform

      - name: Kube-Linter (Best Practices)
        uses: stackrox/kube-linter-action@v1.0.4
        with:
          directory: charts/agent-platform
          # We'll ignore the plaintext password warning for postgresql subchart since it's dev default
          config: .kube-linter.yaml

      - name: Run Trivy vulnerability scanner (IaC)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'charts/agent-platform'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Run Checkov (Policy-as-Code)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: charts/agent-platform
          framework: helm
          quiet: true

      - name: Install Kubeconform
        run: |
          wget https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar -xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Run Kubeconform (Strict Schema & OCP Validation)
        run: |
          helm template agent-platform charts/agent-platform \
            --set secrets.langfuseNextauthSecret="dummy" \
            --set secrets.langfuseSalt="dummy" \
            | kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
  kind-integration:
    runs-on: ubuntu-latest
    needs: scan-and-lint
    environment: e2e-tests
    steps:
      - uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: e2e-cluster

      - name: Install uv
        run: pip install uv

      - name: Deploy to Kind
        run: |
          # Set default kind API URL
          KUBE_API_URL="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          export KUBE_API_URL
          make deploy KUBE_API_URL="$KUBE_API_URL" HELM_ARGS="--set tailscaleIngress.enabled=false"

      - name: Run Smoke Tests
        run: |
          KUBE_API_URL="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          export KUBE_API_URL
          make test-e2e KUBE_API_URL="$KUBE_API_URL"
