apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-platform.fullname" . }}-unified-api-ingress
  labels:
    app: unified-api
spec:
  podSelector:
    matchLabels:
      app: unified-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: tailscale-ingress
      ports:
        - protocol: TCP
          port: 8000
