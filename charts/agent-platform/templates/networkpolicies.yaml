{{- if and .Values.unifiedApi.enabled .Values.tailscaleIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-platform.fullname" . }}-unified-api-ingress
  labels:
    app: unified-api
spec:
  podSelector:
    matchLabels:
      app: unified-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: tailscale-ingress
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
---
{{- if and .Values.tailscaleIngress.enabled .Values.frontend.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-platform.fullname" . }}-frontend-ingress
  labels:
    app: frontend
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: tailscale-ingress
      ports:
        - protocol: TCP
          port: 3000
{{- end }}
---
{{- if .Values.tailscaleIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-platform.fullname" . }}-tailscale-egress
  labels:
    app: tailscale-ingress
spec:
  podSelector:
    matchLabels:
      app: tailscale-ingress
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 443
        - protocol: TCP
          port: 3478
        - protocol: UDP
          port: 3478
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: UDP
{{- if .Values.unifiedApi.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app: unified-api
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
{{- if .Values.frontend.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 3000
{{- end }}
{{- end }}
