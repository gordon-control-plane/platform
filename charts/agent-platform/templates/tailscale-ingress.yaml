{{- if .Values.tailscaleIngress.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-platform.fullname" . }}-caddy-config
data:
  Caddyfile: |
{{ .Values.tailscaleIngress.caddyConfig | indent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent-platform.fullname" . }}-tailscale-ingress
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agent-platform.fullname" . }}-tailscale-ingress
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["{{ include "agent-platform.fullname" . }}-tailscale-state"]
  verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agent-platform.fullname" . }}-tailscale-ingress
subjects:
- kind: ServiceAccount
  name: {{ include "agent-platform.fullname" . }}-tailscale-ingress
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "agent-platform.fullname" . }}-tailscale-ingress
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-platform.fullname" . }}-tailscale-ingress
  labels:
    app: tailscale-ingress
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tailscale-ingress
  template:
    metadata:
      labels:
        app: tailscale-ingress
      annotations:
        kube-linter.io/ignore-checks: "env-var-secret"
        checksum/config: {{ .Values.tailscaleIngress.caddyConfig | sha256sum }}
    spec:
      serviceAccountName: {{ include "agent-platform.fullname" . }}-tailscale-ingress
      initContainers:
        - name: tailscale
          image: "{{ .Values.tailscaleIngress.image.repository }}:{{ .Values.tailscaleIngress.image.tag }}"
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          env:
            - name: TS_USERSPACE
              value: "true"
            - name: TS_KUBE_SECRET
              value: {{ include "agent-platform.fullname" . }}-tailscale-state
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tailscaleIngress.secretName }}
                  key: TS_AUTHKEY
            - name: TS_HOSTNAME
              value: {{ .Values.tailscaleIngress.hostname }}
            - name: TS_EXTRA_ARGS
              value: "--ssh"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            exec:
              command:
                - tailscale
                - status
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: tailscale-run
              mountPath: /var/run/tailscale
            - name: tmp-volume
              mountPath: /tmp

        - name: tailscale-serve-configurator
          image: "{{ .Values.tailscaleIngress.image.repository }}:{{ .Values.tailscaleIngress.image.tag }}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Configuring tailscale serve..."
              tailscale serve --bg --set-path / http://127.0.0.1:8080
              echo "Serve configured."
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tailscale-run
              mountPath: /var/run/tailscale
            - name: tmp-volume
              mountPath: /tmp

      containers:
        - name: caddy
          image: "{{ .Values.tailscaleIngress.caddyImage.repository }}:{{ .Values.tailscaleIngress.caddyImage.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: XDG_CONFIG_HOME
              value: /tmp/caddy/config
            - name: XDG_DATA_HOME
              value: /tmp/caddy/data
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
            - name: tmp-volume
              mountPath: /tmp
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

      volumes:
        - name: tailscale-run
          emptyDir: {}
        - name: tmp-volume
          emptyDir: {}
        - name: caddy-config
          configMap:
            name: {{ include "agent-platform.fullname" . }}-caddy-config
{{- end }}
