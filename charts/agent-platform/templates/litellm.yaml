apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-platform.fullname" . }}-litellm
  labels:
    app: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          image: "ghcr.io/berriai/litellm:main-latest"
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: {{ include "agent-platform.fullname" . }}-secrets
          volumeMounts:
            - name: litellm-config
              mountPath: /app/config.yaml
              subPath: config.yaml
            - name: litellm-middleware
              mountPath: /app/gateway/shunt_middleware.py
              subPath: shunt_middleware.py
            - name: litellm-middleware
              mountPath: /app/gateway/__init__.py
              subPath: __init__.py
      volumes:
        - name: litellm-config
          configMap:
            name: {{ include "agent-platform.fullname" . }}-litellm-config
        - name: litellm-middleware
          configMap:
            name: {{ include "agent-platform.fullname" . }}-litellm-middleware
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-platform.fullname" . }}-litellm
spec:
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
  selector:
    app: litellm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-platform.fullname" . }}-litellm-config
data:
  config.yaml: |
{{ .Files.Get "files/litellm_config.yaml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-platform.fullname" . }}-litellm-middleware
data:
  shunt_middleware.py: |
{{ .Files.Get "files/shunt_middleware.py" | indent 4 }}
  __init__.py: ""
