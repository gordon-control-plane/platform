global:
  image:
    tag: "latest"

fullnameOverride: ""

imagePullSecrets:
  - name: ghcr-secret

gitSync:
  repo: "https://github.com/gordon-control-plane/platform.git"
  branch: "main"

secrets:
  langfuseNextauthSecret: "secret"
  langfuseSalt: "salt"

# Unprivileged Sidecar Bridge Ingress
tailscaleIngress:
  enabled: true
  replicaCount: 1
  image:
    repository: tailscale/tailscale
    tag: latest
  caddyImage:
    repository: ghcr.io/gordon-control-plane/caddy-waf
    tag: latest
  hostname: gordon-control-plane
  # The TS_AUTHKEY should be provided via secret:
  # kubectl create secret generic tailscale-auth --from-literal=TS_AUTHKEY=tskey-auth-xxxx
  secretName: tailscale-auth
  caddyConfig: |
    {
        order coraza_waf first
    }
    http://0.0.0.0:8080 {
        coraza_waf {
            load_owasp_crs
            directives `
                Include @owasp_crs/*.conf
                SecRuleEngine On
            `
        }
        # Proxy routes
        handle /v1/chat* {
            reverse_proxy unified-api:8000
        }

        handle /v1/* {
            reverse_proxy unified-api:8000
        }

        handle /telemetry* {
            reverse_proxy unified-api:8000
        }

        handle /api/* {
            reverse_proxy unified-api:8000
        }

        handle /* {
            reverse_proxy frontend:3000
        }
    }

unifiedApi:
  enabled: true
  replicaCount: 1
  image:
    repository: agent-unified-api
    tag: local
    pullPolicy: IfNotPresent
  githubRepo: "YOUR_ORG/YOUR_CONFIG_REPO" # MUST CHANGE THIS!
  service:
    port: 8000

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: agent-frontend
    tag: local
    pullPolicy: IfNotPresent
  env:
    HOSTNAME: "0.0.0.0"
  service:
    port: 3000

litellm:
  enabled: true
  service:
    port: 4000

postgresql:
  enabled: false

workers:
  # To prepare for Kata containers in 2.7, set this to e.g. "kata"
  runtimeClassName: ""

minio:
  enabled: true
  auth:
    rootUser: admin
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    fsGroup: 1001
  # MinIO writes to /tmp and /data
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp
  extraVolumes:
    - name: tmp
      emptyDir: {}

victoriametrics:
  enabled: true
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp
  extraVolumes:
    - name: tmp
      emptyDir: {}

git-pkgs-proxy:
  enabled: true
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

promptfoo:
  enabled: true
