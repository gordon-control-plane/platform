# Unprivileged Sidecar Bridge Ingress
tailscaleIngress:
  enabled: true
  replicaCount: 1
  image:
    repository: tailscale/tailscale
    tag: latest
  caddyImage:
    repository: caddy
    tag: 2-alpine
  hostname: gordon-control-plane
  # The TS_AUTHKEY should be provided via secret:
  # kubectl create secret generic tailscale-auth --from-literal=TS_AUTHKEY=tskey-auth-xxxx
  secretName: tailscale-auth
  caddyConfig: |
    # Caddyfile config
    # Use tailscale provided cert
    {$TS_HOSTNAME}.tailnet-xxxx.ts.net {
        # Secure the backend with Tailscale provided TLS
        tls /var/run/tailscale/certs/tls.crt /var/run/tailscale/certs/tls.key

        # Drop any spoofed Tailscale headers from the outside
        request_header -Tailscale-User-Login
        request_header -Tailscale-User-Name
        request_header -Tailscale-User-Profile-Pic

        # Proxy routes
        handle /v1/chat* {
            reverse_proxy litellm:4000
        }

        handle /v1/* {
            reverse_proxy unified-api:8000
        }

        handle /telemetry* {
            reverse_proxy unified-api:8000
        }

        handle /api/* {
            reverse_proxy unified-api:8000
        }

        handle /* {
            reverse_proxy frontend:3000
        }
    }

unifiedApi:
  enabled: true
  replicaCount: 1
  image:
    repository: gordon-control-plane/unified-api
    tag: latest
  service:
    port: 8000

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: gordon-control-plane/frontend
    tag: latest
  service:
    port: 3000

litellm:
  enabled: true
  service:
    port: 4000
