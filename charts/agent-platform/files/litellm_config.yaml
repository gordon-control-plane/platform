model_list:
  - model_name: gpt-4
    litellm_params:
      model: openai/gpt-4-turbo-preview
      api_key: "os.environ/OPENAI_API_KEY"
      rpm: 500
      tpm: 100000

  - model_name: gpt-4
    litellm_params:
      model: azure/gpt-4
      api_base: "os.environ/AZURE_API_BASE"
      api_key: "os.environ/AZURE_API_KEY"
      api_version: "2024-02-15-preview"
      rpm: 500
      tpm: 100000

  - model_name: gpt-3.5-turbo
    litellm_params:
      model: openai/gpt-3.5-turbo
      api_key: "os.environ/OPENAI_API_KEY"

litellm_settings:
  # Enable Prometheus metrics
  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]

  # Explicitly disable caching to prevent agentic staleness
  cache: false

  # Define fallback chains
  # If the primary gpt-4 fails, fallback to azure, then gpt-3.5-turbo
  fallbacks:
    - {"gpt-4": ["azure/gpt-4", "gpt-3.5-turbo"]}

  # Enable retry policies
  num_retries: 3
  request_timeout: 60
